ادة الذاتية لأن التأخير في معالجة بيانات القيادة قد يؤثر على السلامة، لذلك تعالج بعض البيانات محليا لتقليل زمن الاستجابة وتتخذ السيارة قرارها على متنها دون انتظار السحابة - ص 7-8",page:"ص 7-8"},{q:"ما هي شبكات التواصل الاجتماعي SNS؟",a:"منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته بسرعة - ص 7",page:"ص 7"},{q:"ما هي التجارة الإلكترونية؟",a:"بيع السلع والخدمات وشراؤها عبر الإنترنت، مثل متاجر إلكترونية أمازون وإيباي - ص 7",page:"ص 7"},{q:"ما هو العمل عن بعد؟",a:"نمط عمل يؤدي فيه الشخص مهامه من المنزل أو موقع بعيد آخر باستخدام الإنترنت - ص 7 و 10",page:"ص 7 و 10"},{q:"ما هو التعلم عبر الإنترنت؟",a:"نمط تعليمي تقدم فيه الدروس والمواد عبر الإنترنت - ص 7 و 10",page:"ص 7 و 10"},{q:"ما هو الدفع غير النقدي؟",a:"دفع قيمة السلع أو الخدمات بوسائل غير نقدية مثل البطاقات المصرفية أو تطبيقات الهاتف أو رموز QR - ص 7",page:"ص 7"},{q:"ما هي القيادة الذاتية؟",a:"تقنية تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة، تستخدم المركبة كاميرات ومستشعرات لإدراك محيطها ثم يعالج النظام البيانات لاتخاذ قرارات القيادة والتحكم، ويتفاوت مقدار التدخل البشري بحسب مستوى الأتمتة - ص 7 و 10",page:"ص 7 و 10"},{q:"ما هو الواقع المعزز AR؟",a:"تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي - ص 8",page:"ص 8"},{q:"ما هو الواقع الافتراضي VR؟",a:"تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبيا للانغماس في فضاء افتراضي - ص 8",page:"ص 8"},{q:"ما الفرق بين AR و VR؟",a:"الواقع المعزز يضيف عناصر رقمية إلى العالم الحقيقي، بينما الواقع الافتراضي يضع المستخدم داخل بيئة رقمية كاملة - ص 8",page:"ص 8"},{q:"ما هي الحوسبة الكمومية؟",a:"نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات، قد يوفر تفوقا في فئات محددة من المسائل لكنه ليس بديلا للحواسيب التقليدية لكل المسائل - تستخدم مبدأ التراكب الكمومي، البت التقليدي يحمل حالة واحدة أما الكيوبت يحمل حالات متعددة - ص 8",page:"ص 8"},{q:"هل الحوسبة الكمومية ستسرع جميع الحسابات؟",a:"لا، هي متخصصة تفيد في فئات محددة من المسائل وليست بديلا عاما - ص 7-8",page:"ص 7-8"},{q:"رتب مراحل تطور IT بالترتيب الصحيح؟",a:"ظهور الحاسب (الأربعينيات-الستينيات) → تسويق الإنترنت تجاريا (التسعينيات) → ظهور الهواتف الذكية (العقد الأول) → انتشار الحوسبة السحابية (العقد الثاني فصاعدا) - ص 9 محلول",page:"ص 9"},{q:"كيف غيرت الحوسبة السحابية طريقة استخدام تكنولوجيا المعلومات؟ [6 درجات ص 10]",a:"من العقد الثاني للألفية، أصبحت موارد تكنولوجيا المعلومات تقدم كخدمة عبر الإنترنت، مما مكن من تحليل البيانات الضخمة والذكاء الاصطناعي وتقديم الخدمات الرقمية كجزء من الحياة اليومية، ولم يعد التأثير مقتصرا على أجهزة أصغر أو أسرع بل امتد إلى طرق الوصول للمعلومات والعمل والتعلم والدفع",page:"ص 10"},{q:"اذكر خمسة تحولات مجتمعية أحدثتها تكنولوجيا المعلومات؟",a:"1- شبكات التواصل الاجتماعي 2- التجارة الإلكترونية 3- العمل عن بعد 4- التعلم عبر الإنترنت 5- الدفع غير النقدي - ص 7",page:"ص 7"},{q:"صنف الأمثلة: شراء منتجات عبر التسوق الإلكتروني - الدفع بتطبيق على الهاتف - مشاركة الصور على التواصل - شركة تطبق العمل من المنزل؟",a:"1- التجارة الإلكترونية 2- الدفع غير النقدي 3- شبكات التواصل الاجتماعي 4- العمل عن بعد - ص 10",page:"ص 10"},{q:"ما الفرق بين الواقع المعزز والقيادة الذاتية والواقع الافتراضي؟",a:"AR: إضافة معلومات رقمية فوق صور العالم الحقيقي - القيادة الذاتية: تستخدم AI لقيادة مركبة بأقل تدخل بشري حسب مستوى الأتمتة - VR: إتاحة الانغماس في فضاء افتراضي - ص 9-10",page:"ص 9-10"},{q:"لماذا السحابة هي أجهزة حقيقية في مكان حقيقي؟",a:"لأن مصطلح السحابة مجازي لكنه في الحقيقة خوادم ومراكز بيانات حقيقية في مكان حقيقي تقدم الخدمات عبر الإنترنت - ص 7",page:"ص 7"},{q:"ما التغيرات اليومية التي لاحظها الطالب في المثال الافتتاحي؟",a:"يقرأ رسائله على تطبيقات التواصل الاجتماعي، يدفع ثمن إفطاره إلكترونيا باستخدام تطبيق للدفع غير النقدي، ينضم إلى درس عبر الإنترنت، ويطلب كتابا من متجر إلكتروني - هذه الخدمات لم تكن متاحة بهذه الصورة قبل 30 عاما - ص 6",page:"ص 6"},{q:"ما إيجابيات وسلبيات مجتمع غير نقدي؟ [طبق قرر ص 11]",a:"فائدة: سرعة الدفع وسهولته لصاحب متجر صغير وعميل، عدم الحاجة لحمل نقد - تحدي: شخص ليس لديه بطاقة بنكية أو هاتف ذكي يواجه صعوبة، ومخاوف الأمان والخصوصية والوصول",page:"ص 11"},{q:"قرية لم يكن فيها اتصال بالإنترنت ثم اتصلت بإنترنت عالي السرعة وأصبحت خدمات الدفع غير النقدي متاحة - توقع تغيرين وتحديا؟",a:"تغير1: ظهور التجارة الإلكترونية والتعلم عبر الإنترنت والعمل عن بعد - تغير2: انتشار التواصل الاجتماعي وتغير طريقة التواصل - تحدي: الفجوة الرقمية ومهارات الاستخدام والأمان والخصوصية وإتاحة الوصول",page:"ص 11"},{q:"ما إجابة السؤال الرئيسي؟",a:"مرت تكنولوجيا المعلومات بسلسلة من المراحل المتتابعة من الحواسيب الأولى إلى الإنترنت والحوسبة السحابية، ولم يقتصر أثرها على أجهزة أصغر أو أسرع بل امتد إلى طرق الوصول للمعلومات والتواصل والعمل والتعلم والدفع، ومع انتشار الإنترنت والهواتف الذكية والحوسبة السحابية أصبحت خدمات كثيرة رقمية جزءا من الحياة اليومية وظهرت تحديات جديدة تتعلق بالأمان والإنصاف وإتاحة الوصول لذلك يرتبط تطور التقنية بتغيرات اجتماعية واقتصادية تحتاج إلى فهم وتقييم - ص 11",page:"ص 11"},{q:"ما الخريطة المفاهيمية للدرس؟",a:"الفكرة الأساسية: كل مرحلة أضافت جهازا وغيرت طريقة المجتمع - المفاهيم: قانون مور، شبكات التواصل SNS، التجارة الإلكترونية، العمل عن بعد، التعلم عبر الإنترنت، الدفع غير النقدي، الحوسبة الطرفية، القيادة الذاتية، AR/VR، الحوسبة الكمومية - المحتوى: الحواسب، الشبكات، الذكاء الاصطناعي - السياق: اجتماعي واقتصادي - ATL: البحث والتفكير - ص 6",page:"ص 6"}]},{id:2,title:"الدرس الثاني",subtitle:"مفاهيم الذكاء الاصطناعي",pages:"ص 12 - 18",questions:[{q:"ما هو الذكاء الاصطناعي AI حسب كتاب الوزارة؟",a:"هو قدرة الأنظمة الحاسوبية على محاكاة قدرات بشرية مثل التعلم والاستدلال وحل المشكلات والتعرف على الأنماط واتخاذ القرار.",page:"ص 12"},{q:"ما هو التعلم الآلي ML؟",a:"فرع من الذكاء الاصطناعي يتعلم الأنماط من بيانات التدريب لإجراء تنبؤات أو تصنيف دون برمجة صريحة لكل حالة.",page:"ص 12"},{q:"ما هو التعلم العميق DL؟",a:"فرع من التعلم الآلي يستخدم شبكات عصبية عميقة متعددة الطبقات لتعلم الأنماط المعقدة في الصور والنصوص والأصوات.",page:"ص 12"},{q:"ما هو الذكاء التوليدي GenAI؟",a:"نوع من التعلم العميق يولد محتوى جديد (نص، صورة، صوت، كود) بناء على ما تعلمه من بيانات التدريب، مثل نماذج اللغة الكبيرة ومولدات الصور.",page:"ص 13"},{q:"ما علاقة AI و ML و DL و GenAI؟",a:"علاقة احتواء متدرجة: AI هو المظلة العامة > ML فرع منه > DL فرع من ML > GenAI فرع من DL. كلما دخلنا للداخل زاد التخصص.",page:"ص 13"},{q:"ما هي بيانات التدريب؟",a:"هي الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه، مثل صور مصنفة أو نصوص.",page:"ص 13"},{q:"ما هو النموذج Model؟",a:"هو النظام الذي تم تدريبه على بيانات التدريب وأصبح قادرا على التنبؤ أو التصنيف أو التوليد.",page:"ص 14"},{q:"كيف يتعلم النموذج؟",a:"بتحليل بيانات التدريب واستخراج الأنماط والعلاقات الإحصائية ثم استخدامها للتنبؤ عند رؤية بيانات جديدة.",page:"ص 14"},{q:"ما هي الشبكة العصبية الاصطناعية؟",a:"نموذج حوسبي مستوحى من الدماغ مكون من طبقات من العقد (العصبونات) المترابطة تتعلم الأنماط تدريجيا.",page:"ص 14"},{q:"ما هي الشبكة العصبية العميقة؟",a:"شبكة عصبية بها طبقات كثيرة (عميقة) تمكنها من تعلم أنماط معقدة جدا مثل ملامح الوجه أو بنية الجملة.",page:"ص 15"},{q:"ما الفرق بين البرمجة التقليدية والتعلم الآلي؟",a:"التقليدية: الإنسان يكتب القواعد صراحة - التعلم الآلي: النظام يستنتج القواعد من البيانات.",page:"ص 15"},{q:"ما هو الذكاء الضيق Narrow AI؟",a:"ذكاء متخصص في مهمة محددة مثل التوصية أو الترجمة، وهو الموجود حاليا، عكس الذكاء العام الذي يفهم مثل الإنسان.",page:"ص 15"},{q:"ما هي الهلوسة Hallucination؟",a:"توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة، تحدث عندما يولد النموذج إجابة لا تستند لبيانات حقيقية.",page:"ص 16"},{q:"لماذا تحدث الهلوسة في GenAI؟",a:"لأنه يتنبأ بالكلمة أو الصورة التالية إحصائيا وليس بفهم حقيقي، وإذا كانت البيانات غير كافية يختلق معلومات تبدو منطقية.",page:"ص 16"},{q:"ما هي مشكلة الصندوق الأسود Black Box؟",a:"عندما يكون من غير الواضح كيف توصل الذكاء الاصطناعي إلى حكمه أو قراره، فيصعب تفسيره واكتشاف أخطائه أو تحيزه.",page:"ص 16"},{q:"ما هو الذكاء القابل للتفسير XAI؟",a:"تقنيات تتيح للبشر فهم سبب اتخاذ الذكاء حكما معينا، تساعد على فهم العوامل التي أسهمت في المخرج، تعالج مشكلة الصندوق الأسود.",page:"ص 17"},{q:"كيف نقيم أداء النموذج؟",a:"باختباره على بيانات جديدة لم يرها أثناء التدريب وقياس دقته، وفحص هل يكرر الأنماط بشكل صحيح.",page:"ص 17"},{q:"ما هو التحيز في بيانات التدريب؟",a:"عندما تكون بيانات التدريب غير ممثلة للواقع أو متحيزة لفئة معينة، مما يجعل المخرجات غير عادلة.",page:"ص 17"},{q:"ما أثر بيانات تدريب غير كافية عن سمة معينة؟",a:"يؤدي لضعف الأداء على تلك السمة وزيادة احتمال التحيز وسوء التعرف.",page:"ص 17"},{q:"هل الذكاء الاصطناعي يفهم مثل الإنسان؟",a:"لا، هو يتعرف على الأنماط إحصائيا ويتنبأ بناء عليها ولا يفهم المعنى أو السياق مثل الإنسان.",page:"ص 18"},{q:"اذكر مثال على ML ومثال على GenAI من كتابك؟",a:"ML: نظام يصنف رسائل البريد إلى مزعج وغير مزعج أو يتنبأ بأسعار - GenAI: نموذج يولد نصا أو يولد صورة من وصف نصي.",page:"ص 18"},{q:"كيف يتعلم نظام التعرف على الصور؟",a:"يتدرب على آلاف الصور المصنفة (قطة/كلب مثلا) ويتعلم الأنماط البصرية المميزة لكل فئة ثم يصنف صورا جديدة.",page:"ص 18"},{q:"لماذا نحتاج إشراف بشري على مخرجات GenAI؟",a:"لأنه قد يهلوس وينتج معلومات خاطئة، ولأنه صندوق أسود قد يحتوي تحيزا، لذلك يجب التحقق من المصادر وعدم الاعتماد عليه وحده في القرارات عالية الأثر.",page:"ص 18"},{q:"ما هو الاستدلال Inference؟",a:"مرحلة استخدام النموذج المدرب للتنبؤ أو التوليد عند إدخال بيانات جديدة.",page:"ص 18"},{q:"ما الفرق بين التدريب والاستدلال؟",a:"التدريب: مرحلة التعلم من البيانات وبناء الأنماط - الاستدلال: مرحلة استخدام النموذج المدرب لتطبيق ما تعلمه.",page:"ص 18"},{q:"ما هو التعلم بإشراف؟",a:"يتعلم من بيانات مصنفة (مدخلات مع مخرجات صحيحة) مثل صور عليها تسميات.",page:"ص 18"},{q:"ما هو التعلم بدون إشراف؟",a:"يتعلم من بيانات غير مصنفة ويكتشف الأنماط بنفسه مثل تجميع العملاء المتشابهين.",page:"ص 18"},{q:"حلل: نظام ذكاء توليدي أعطى إجابة خاطئة عن تاريخ حدث - ما السبب وما الحل؟ [6 درجات]",a:"السبب: هلوسة - النموذج تنبأ إحصائيا دون مصدر حقيقي - الحل: التحقق من مصادر موثوقة، استخدام بيانات تدريب محدثة، تطبيق XAI لفهم سبب الحكم، وإشراف بشري وعدم الاعتماد عليه وحده.",page:"ص 18"},{q:"لماذا يعتبر GenAI صندوق أسود أكثر من ML البسيط؟",a:"لأن شبكاته العميقة بها ملايين المعاملات وطبقات كثيرة فيصعب تتبع كيف توصل لنص أو صورة معينة، عكس ML البسيط الذي قواعده أوضح.",page:"ص 18"},{q:"ما خلاصة الدرس 1-2؟",a:"الذكاء الاصطناعي يتدرج من عام (AI) إلى تعلم من البيانات (ML) إلى شبكات عميقة (DL) إلى توليد محتوى (GenAI)، يتعلم من بيانات التدريب عبر شبكات عصبية، لكنه قد يهلوس ويكون صندوق أسود لذلك يحتاج تحقق بشري وتفسير XAI.",page:"ص 18"}]},{id:3,title:"الدرس الثالث",subtitle:"تطبيقات الذكاء الاصطناعي",pages:"ص 19 - 23",questions:[{q:"ما هي الخدمات الأربع التي تستخدم الذكاء في الحياة اليومية حسب كتابك؟",a:"1- أنظمة التوصية 2- المساعدات الصوتية 3- الترجمة الآلية 4- التعرف على الوجه",page:"ص 19"},{q:"ما هو نظام التوصية وكيف يعمل؟",a:"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات، يحلل ما شاهدته أو اشتريته أو استمعت إليه سابقا ويتنبأ بما قد يهمك.",page:"ص 19"},{q:"اذكر أمثلة على أنظمة التوصية؟",a:"يوتيوب (توصية فيديوهات)، أمازون (توصية منتجات)، سبوتيفاي (توصية أغاني) - ص 19",page:"ص 19"},{q:"ما هو المساعد الصوتي وكيف يعمل؟",a:"تقنية تتعرف على الصوت وتفهم الأوامر وتنفذها، تحول الصوت لنص ثم تفهم النية ثم تنفذ الأمر.",page:"ص 19"},{q:"اذكر أمثلة على المساعدات الصوتية؟",a:"سيري Siri ومساعد جوجل Google Assistant - ص 19",page:"ص 19"},{q:"ما هي الترجمة الآلية؟",a:"ترجمة النص تلقائيا إلى لغات مختلفة باستخدام الذكاء الاصطناعي.",page:"ص 19"},{q:"اذكر أمثلة على الترجمة الآلية؟",a:"Google Translate و DeepL - ص 19",page:"ص 19"},{q:"ما هو التعرف على الوجه؟",a:"الكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائيا.",page:"ص 19"},{q:"اذكر مثال على التعرف على الوجه؟",a:"فتح الهاتف الذكي بالوجه - ص 19",page:"ص 19"},{q:"كيف يستخدم الذكاء في الرعاية الصحية؟",a:"1- التشخيص بالصور: الكشف عن الأمراض من الأشعة السينية والمقطعية 2- دعم اكتشاف الأدوية - ص 20",page:"ص 20"},{q:"كيف يستخدم في الزراعة؟",a:"التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض - ص 20",page:"ص 20"},{q:"كيف يستخدم في التصنيع؟",a:"أتمتة فحص جودة المنتج والصيانة التنبؤية - ص 20",page:"ص 20"},{q:"ما هي الصيانة التنبؤية؟",a:"استخدام البيانات والذكاء للتنبؤ بأعطال الآلات قبل وقوعها لتقليل التوقف.",page:"ص 20"},{q:"كيف يستخدم في الخدمات اللوجستية؟",a:"تحسين مسارات التوصيل لتوفير الوقت والوقود - ص 20",page:"ص 20"},{q:"ما الذي يبرع فيه الذكاء الاصطناعي؟ [ص 22]",a:"1- إيجاد وتصنيف الأنماط في البيانات المعقدة مثل الصور والنصوص 2- التعرف على الصور والأصوات والنصوص وتوليد بعض أنواع المحتوى 3- الاستدلال الاحتمالي والتنبؤ استنادا إلى البيانات",page:"ص 22"},{q:"ما الذي يتطلب الحذر عند استخدام الذكاء؟ [ص 22]",a:"1- القرارات ذات البعد الأخلاقي التي قد تؤدي إلى تمييز أو تحيز 2- التعامل مع المعلومات الشخصية والبيانات الحساسة والخصوصية 3- القرارات عالية الأثر وتحديد المسؤولية عن نتائجها",page:"ص 22"},{q:"لماذا يحتاج التشخيص بالصور لإشراف بشري؟ [توقف وفكر ص 21]",a:"لأنه قرار عالي الأثر يخص حياة الأشخاص ويتعلق بالأخلاق والخصوصية والمسؤولية، ويجب التحقق من مخرجاته وعدم الاعتماد على الذكاء وحده.",page:"ص 21"},{q:"ما الفرق بين استخدام يومي وصناعي؟",a:"اليومي: يركز على راحة المستخدم (توصية، صوتي، ترجمة، وجه) - الصناعي: يركز على الكفاءة والإنتاجية (تشخيص، أدوية، حصاد، آفات، جودة، صيانة، مسارات)",page:"ص 22"},{q:"حلل: مكتبة مدرسية تريد نظام توصية كتب - كيف يعمل وما الاحتياط؟",a:"يعمل: يحلل بيانات استعارة الطلاب السابقة (سلوك سابق) ويتنبأ بما قد يهمهم - احتياط: حماية خصوصية بيانات الاستعارة وعدم استخدامها لغير الغرض الأصلي",page:"ص 22"},{q:"ما مخاطر استخدام بيانات السلوك في التوصية؟",a:"يثير مخاوف خصوصية لأن خدمات الذكاء تستخدم ما تشاهده وتشتريه وتقوله وتجمع بيانات جماعية",page:"ص 22"},{q:"اذكر ميزة وتحدي لاستخدام AI في فحص الجودة؟",a:"ميزة: سرعة ودقة كشف العيوب - تحدي: بيانات تدريب متحيزة قد تؤدي لتمييز أو خطأ وتحتاج إشراف بشري",page:"ص 22"},{q:"هل توصية فيديو بنفس أهمية خطأ تشخيص طبي؟",a:"لا، التشخيص أهم لأن أثر الخطأ عالي ويمس حياة ومسؤولية وأخلاق، بينما التوصية أثرها أقل",page:"ص 22"},{q:"كيف يعمل التعرف على الوجه في فتح الهاتف؟",a:"يكشف الوجه في الصورة ويستخرج أنماطه ويقارنها بالأنماط المخزنة ويتعرف عليها تلقائيا",page:"ص 22"},{q:"ما هو دور البيانات الضخمة في الصناعة؟",a:"توفر أمثلة كثيرة يتعلم منها الذكاء أنماط الجودة والأعطال والحصاد والمسارات",page:"ص 22"},{q:"لماذا تحسين مسارات التوصيل مهم؟",a:"يوفر وقت ووقود وتكلفة ويحسن خدمة العملاء",page:"ص 22"},{q:"ما علاقة الدرس 1-2 بالدرس 1-3؟",a:"1-2 شرح كيف يعمل (تعلم من بيانات) - 1-3 شرح أين يعمل (حياة يومية وصناعة) بتطبيق نفس المبدأ",page:"ص 23"},{q:"طبق: شركة تريد استخدام AI لاختيار موظفين من السيرة الذاتية - هل هذا يبرع فيه أم يحتاج حذر؟",a:"يحتاج حذر لأنه قرار ذو بعد أخلاقي قد يؤدي لتمييز وتحيز ويمس الخصوصية والمسؤولية",page:"ص 23"},{q:"ما هي حدود الذكاء في توليد المحتوى؟",a:"يبرع في توليد بعض أنواع المحتوى لكنه قد يهلوس وينتج معلومات غير صحيحة تبدو مقنعة",page:"ص 23"},{q:"ما هو الاستدلال الاحتمالي؟",a:"التنبؤ بناء على احتمالات مستندة إلى البيانات وليس يقين مطلق، مثل احتمال إصابة بمرض من صورة",page:"ص 23"},{q:"ما خلاصة الدرس 1-3؟ [ص 23]",a:"الذكاء بارع في إيجاد الأنماط والتصنيف - خدمات يومية: التوصيات والصوت والترجمة والوجه - مهام صناعية: التشخيص بالصور ودعم اكتشاف الأدوية والتنبؤ بالحصاد والكشف عن الآفات وفحص الجودة والصيانة التنبؤية وتحسين المسارات - لكن الحكم البشري لا يزال ضروريا عندما يتعلق الأمر بالأخلاق والخصوصية والمسؤولية",page:"ص 23"}]},{id:4,title:"الدرس الرابع",subtitle:"أخلاقيات الذكاء الاصطناعي",pages:"ص 24 - 29",questions:[{q:"ما هو التحيز الخوارزمي؟",a:"نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وقد ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي - ص 26",page:"ص 26"},{q:"ما هي بيانات التدريب؟",a:"هي الأمثلة التي يتعلم منها نظام الذكاء أنماطه قبل استخدامه؛ وكلما قل تمثيلها للواقع زاد احتمال تحيز مخرجاته",page:"ص 26"},{q:"ما أسباب التحيز الخوارزمي؟",a:"1- بيانات تدريب متحيزة 2- انعكاس نزعات تمييزية سابقة في المجتمع 3- بيانات غير كافية عن سمات معينة 4- تصميم النظام وطريقة استخدامه - ص 26",page:"ص 26"},{q:"اذكر مثالين على التحيز؟",a:"1- نظام توظيف يفضل فئة على أخرى 2- نظام تعرف على وجه أكثر عرضة لإساءة التعرف على مجموعات عرقية معينة - ص 26",page:"ص 26"},{q:"ما هي قضايا الخصوصية في الذكاء الاصطناعي؟",a:"نوعان حسب ص 26: 1- المراقبة عبر التعرف على الوجه: كاميرات في الأماكن العامة تتعرف على الأفراد وتتبعهم 2- الجمع الجماعي للبيانات الشخصية: تجمع وتحلل كميات كبيرة من بيانات السلوك عبر الإنترنت",page:"ص 26"},{q:"ما هو الذكاء القابل للتفسير XAI؟",a:"تقنية تتيح للبشر فهم سبب اتخاذ الذكاء حكما معينا - أساليب تساعد على فهم العوامل التي أسهمت في وصول النظام لمخرج - اختصاره XAI - ص 27",page:"ص 27"},{q:"ما هي مشكلة الصندوق الأسود؟",a:"عندما يكون غير واضح كيف توصل الذكاء لحكمه فيصعب تقييمه واكتشاف الأخطاء أو التحيز - ص 27",page:"ص 27"},{q:"ما هي المسؤولية Responsibility؟",a:"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه مثل المطور والجهة المشغلة والمستخدم، لا يوجد توزيع واحد يصلح لكل السياقات - ص 27",page:"ص 27"},{q:"ما هي المساءلة Accountability؟",a:"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها - ص 27",page:"ص 27"},{q:"ما هي الشفافية Transparency؟",a:"إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده - ص 27",page:"ص 27"},{q:"ما هي العدالة Fairness؟",a:"عدم التمييز ظلما ضد أي شخص أو مجموعة بعينها - ص 27",page:"ص 27"},{q:"ما هي حماية الخصوصية؟",a:"التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها وعدم استخدامها لغير الغرض الأصلي - ص 27",page:"ص 27"},{q:"ما الفرق بين المسؤولية والمساءلة؟",a:"المسؤولية: توزيع الأدوار والواجبات - المساءلة: تحديد من يحاسب على النتيجة وآثارها وفق أدواره",page:"ص 27"},{q:"هل المساءلة هي نفسها شرح القرار؟",a:"لا، الشرح وظيفة XAI، المساءلة وظيفة تحديد الجهة التي تحاسب - ص 27",page:"ص 27"},{q:"ما هي المبادئ الأربعة للاستخدام المسؤول؟",a:"1- العدالة 2- الشفافية 3- حماية الخصوصية 4- المساءلة - ص 27",page:"ص 27"},{q:"كيف نقلل التحيز بمبدأ العدالة؟",a:"بفحص تمثيل بيانات التدريب واختبار النتائج عبر فئات مختلفة لضمان عدم التمييز ظلما - ص 28",page:"ص 28"},{q:"كيف نقلل التحيز بمبدأ الشفافية؟",a:"بإظهار عملية اتخاذ القرار وحدوده ومراجعة طريقة تصميم النظام والسياق البشري والاجتماعي - ص 28",page:"ص 28"},{q:"حلل سؤال امتحان [6 درجات ص 28]: نظام توظيف متحيز ضد فئة - كيف ينشأ وكيف يقلل؟",a:"ينشأ من بيانات تدريب متحيزة تعكس تمييز سابق أو غير كافية عن تلك الفئة. يقلل بـ: العدالة: فحص تمثيل البيانات واختبار عبر فئات. الشفافية: إظهار عملية اتخاذ القرار وحدوده. المسؤولية: تحديد أدوار المطور والمشغل. XAI: فهم العوامل المؤثرة.",page:"ص 28"},{q:"لماذا لا يوجد توزيع واحد للمسؤولية يصلح لكل السياقات؟",a:"لأن المسؤولية تختلف باختلاف النظام والاستخدام والقوا
